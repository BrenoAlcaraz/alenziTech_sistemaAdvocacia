{# Meu dia / Calendário / Kanban alternam no cliente (data-view-toggle/data-view, static/js/main.js) — as três visões chegam prontas no mesmo request, com os mesmos filtros. #}
<div class="flex gap-1 p-1 bg-gray-100 rounded-xl w-fit max-w-full overflow-x-auto mb-6">
  {% for valor, rotulo in visoes_opcoes %}
  <button type="button" data-view-toggle="{{ valor }}"
     class="px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap {% if visao == valor %}bg-white text-gray-900{% else %}text-gray-500 hover:text-gray-700{% endif %}">
    {{ rotulo }}
  </button>
  {% endfor %}
</div>
