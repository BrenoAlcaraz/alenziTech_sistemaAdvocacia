<div class="flex items-center justify-between mb-6">
  <div>
    <h1 class="text-2xl font-bold text-gray-900">Agenda</h1>
    <p class="text-sm text-gray-500 mt-0.5">
      Compromissos, audiências e prazos do escritório &bull;
      <a href="{% url 'agenda:cancelados' %}?escopo={{ escopo_atual }}" class="text-gray-400 hover:text-gray-600 underline">Ver compromissos cancelados</a>
    </p>
  </div>
  <a href="{% url 'agenda:novo' %}" class="btn-primary">+ Novo compromisso</a>
</div>

{% if usuario_filtro %}
<div class="mb-4 px-4 py-2.5 rounded-lg bg-juridico-bege text-sm text-gray-700 flex items-center justify-between">
  <span>Mostrando a agenda de <strong>{{ usuario_filtro.get_full_name|default:usuario_filtro.username }}</strong></span>
  <a href="{% url 'agenda:index' %}" class="text-juridico-ouro font-medium hover:underline">Ver a minha →</a>
</div>
{% endif %}
