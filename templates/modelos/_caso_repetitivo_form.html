<div class="card p-4" data-formset-item>
  <div class="flex items-center justify-between mb-3">
    <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Caso</p>
    <button type="button" data-formset-remove class="text-xs font-medium text-red-600 hover:text-red-700 cursor-pointer">Remover</button>
  </div>

  <div class="mb-3">
    <label class="label" for="{{ caso_form.cliente.id_for_label }}">{{ caso_form.cliente.label }}</label>
    {{ caso_form.cliente }}
    {% if caso_form.cliente.errors %}<p class="text-xs text-red-600 mt-1">{{ caso_form.cliente.errors|join:", " }}</p>{% endif %}
  </div>

  <div class="grid grid-cols-2 gap-3 mb-3">
    <div>
      <label class="label" for="{{ caso_form.valor.id_for_label }}">{{ caso_form.valor.label }}</label>
      {{ caso_form.valor }}
    </div>
    <div>
      <label class="label" for="{{ caso_form.endereco_caso.id_for_label }}">{{ caso_form.endereco_caso.label }}</label>
      {{ caso_form.endereco_caso }}
    </div>
  </div>

  <div>
    <label class="label" for="{{ caso_form.particularidades.id_for_label }}">{{ caso_form.particularidades.label }}</label>
    {{ caso_form.particularidades }}
  </div>
</div>
