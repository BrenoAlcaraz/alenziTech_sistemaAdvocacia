<input type="hidden" name="situacao" value="{{ situacao }}">
<div class="barra-filtros-campo">
  <label for="f-cliente" class="label">Cliente</label>
  <select id="f-cliente" name="cliente" class="select">
    <option value="">Todos</option>
    {% for c in clientes_filtro %}<option value="{{ c.pk }}" {% if filtros.cliente == c.pk|stringformat:"s" %}selected{% endif %}>{{ c }}</option>{% endfor %}
  </select>
</div>
<div class="barra-filtros-campo">
  <label for="f-processo" class="label">Processo</label>
  <select id="f-processo" name="processo" class="select">
    <option value="">Todos</option>
    {% for p in processos_filtro %}<option value="{{ p.pk }}" {% if filtros.processo == p.pk|stringformat:"s" %}selected{% endif %}>{{ p }}</option>{% endfor %}
  </select>
</div>
{% if tem_acesso_dados %}
<div class="barra-filtros-campo">
  <label for="f-solicitante" class="label">Solicitado por</label>
  <select id="f-solicitante" name="solicitante" class="select">
    <option value="">Todos</option>
    {% for u in solicitantes_filtro %}<option value="{{ u.pk }}" {% if filtros.solicitante == u.pk|stringformat:"s" %}selected{% endif %}>{{ u.get_full_name|default:u.username }}</option>{% endfor %}
  </select>
</div>
{% endif %}
<div class="barra-filtros-campo">
  <p class="label">Solicitada entre</p>
  <div class="flex items-center gap-1">
    <input type="date" name="solicitado_de" aria-label="Solicitada a partir de" value="{{ filtros.solicitado_de }}" class="input">
    <input type="date" name="solicitado_ate" aria-label="Solicitada até" value="{{ filtros.solicitado_ate }}" class="input">
  </div>
</div>
{% if situacao == "pendentes" %}
<div class="barra-filtros-campo">
  <label for="f-vencimento" class="label">Vencimento</label>
  <select id="f-vencimento" name="vencimento" class="select">
    <option value="">Todos</option>
    {% for chave, rotulo in filtros_vencimento %}<option value="{{ chave }}" {% if filtros.vencimento == chave %}selected{% endif %}>{{ rotulo }}</option>{% endfor %}
  </select>
</div>
{% endif %}
{% if situacao == "pagas" %}
<div class="barra-filtros-campo">
  <p class="label">Paga entre</p>
  <div class="flex items-center gap-1">
    <input type="date" name="pago_de" aria-label="Paga a partir de" value="{{ filtros.pago_de }}" class="input">
    <input type="date" name="pago_ate" aria-label="Paga até" value="{{ filtros.pago_ate }}" class="input">
  </div>
</div>
{% if tem_acesso_dados %}
<div class="barra-filtros-campo">
  <label for="f-pagador" class="label">Pagamento realizado por</label>
  <select id="f-pagador" name="pago_por_usuario" class="select">
    <option value="">Todos</option>
    {% for u in pagadores_filtro %}<option value="{{ u.pk }}" {% if filtros.pago_por_usuario == u.pk|stringformat:"s" %}selected{% endif %}>{{ u.get_full_name|default:u.username }}</option>{% endfor %}
  </select>
</div>
{% endif %}
{% endif %}
