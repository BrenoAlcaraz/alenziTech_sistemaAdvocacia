{% load moeda %}
<div class="card p-5">
  <div class="flex items-baseline justify-between mb-3">
    <h3 class="text-sm font-semibold text-gray-900">{{ titulo }}</h3>
    <span class="text-xs text-gray-500">Total: R$ {{ dados.total|moeda_br }}</span>
  </div>
  <div class="flex flex-col gap-3">
    {% for linha in dados.linhas %}
      <div>
        <div class="flex items-center justify-between gap-3 text-xs text-gray-600 mb-1">
          <span class="truncate" title="{{ linha.rotulo }}">{{ linha.rotulo }}</span>
          <span class="flex-shrink-0 font-medium text-gray-900">R$ {{ linha.valor|moeda_br }}</span>
        </div>
        <div class="h-2 rounded-full bg-gray-100 overflow-hidden">
          <div class="h-2 rounded-full {{ cor }}" style="width: {{ linha.pct }}%;"></div>
        </div>
      </div>
    {% empty %}
      <p class="text-xs text-gray-400">{{ vazio }}</p>
    {% endfor %}
  </div>
</div>
