{% extends "base/base_auth.html" %}
{% block title %}Novo grupo — Custas Judiciais — Financeiro{% endblock %}

{% block content %}
<div class="flex items-center gap-3 mb-6">
  <a href="{% url 'financeiro:custas' %}" class="text-gray-500 hover:text-gray-700">
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
    </svg>
  </a>
  <h1 class="text-xl font-bold text-gray-900">Novo grupo</h1>
</div>

<div class="card p-6 max-w-2xl">
  <form method="post">
    {% csrf_token %}
    <div>
      <label class="label" for="{{ form.nome.id_for_label }}">{{ form.nome.label }}</label>
      {{ form.nome }}
      {% if form.nome.errors %}
        <p class="erro-campo text-xs text-red-600 mt-1">{{ form.nome.errors|join:", " }}</p>
      {% endif %}
    </div>
    <div class="flex gap-3 pt-5 border-t border-gray-100 mt-5">
      <button type="submit" class="btn-primary">Criar grupo</button>
      <a href="{% url 'financeiro:custas' %}" class="btn-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
