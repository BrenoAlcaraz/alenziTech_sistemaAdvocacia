{% comment %}
Botões de um documento: olho (pré-visualizar em nova aba) e seta (baixar).
Espera `arquivo_url` — a rota que entrega o arquivo (`?baixar=1` força o download).
{% endcomment %}
<span class="inline-flex items-center gap-1 flex-shrink-0 align-middle">
  <a href="{{ arquivo_url }}" target="_blank" rel="noopener" title="Visualizar" aria-label="Visualizar documento"
     class="w-8 h-8 rounded-lg border border-gray-200 flex items-center justify-center text-gray-500 hover:text-gray-900 hover:border-gray-300 bg-white">
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
  </a>
  <a href="{{ arquivo_url }}?baixar=1" title="Baixar" aria-label="Baixar documento"
     class="w-8 h-8 rounded-lg border border-gray-200 flex items-center justify-center text-gray-500 hover:text-gray-900 hover:border-gray-300 bg-white">
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
      <path stroke-linecap="round" stroke-linejoin="round" d="M7 10l5 5 5-5"/>
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 15V3"/>
    </svg>
  </a>
</span>
